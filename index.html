<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf6f3"><meta name="app-version" content="89"><title>4タイプ診断｜あなたの魅力には、まだ続きがある。</title><style>
:root{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;color:#423842;background:#fbf7f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #a87388;outline-offset:4px}.app{max-width:660px;margin:auto;min-height:100dvh;background:#fffdfb;box-shadow:0 0 80px #6b4e4e0b}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #f0e7e7}.brand{font-size:13px;letter-spacing:.2em;color:#8b6877}.top button{border:0;background:transparent;color:#806b75;font-size:13px;padding:12px}.main{padding:clamp(30px,7vw,58px) clamp(23px,7vw,58px) 75px;min-height:calc(100dvh - 66px)}.eyebrow{color:#a3788a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;font-size:12px;letter-spacing:.19em}.hero{font-size:clamp(29px,7vw,39px);line-height:1.62;font-weight:500;letter-spacing:.065em;margin:30px 0}.lead{font-size:17px;line-height:2.15;white-space:pre-line}.muted{color:#877984;font-size:13px;line-height:1.9}.btn{width:100%;border:1px solid #9e6f82;border-radius:13px;padding:18px 16px;margin-top:28px;background:#986b80;color:white;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;font-size:15px;letter-spacing:.08em}.btn.secondary{background:transparent;color:#8c6075}.choice{display:block;width:100%;padding:24px;border:1px solid #e6cfd7;border-radius:14px;background:#fff8f9;color:#644f5a;font-size:21px;margin:18px 0}.cover{padding-top:10px}.type-letter{font-family:Georgia,serif;font-size:13px;letter-spacing:.35em;color:#aa7e91}.result-heading{font-size:clamp(27px,6vw,36px);line-height:1.7;font-weight:500;margin:17px 0 30px}.intro-title{font-size:22px;line-height:1.75;font-weight:500;color:#725162;margin:40px 0 26px}.prose p{font-size:16px;line-height:2.25;letter-spacing:.035em;margin:0 0 1.7em}.bridge{font-size:17px;line-height:2.1;text-align:center;padding:35px 0 8px;color:#7e5b6d}.book-cover{text-align:center;padding:35px 0 25px}.book-cover h2{font-weight:500;font-size:29px;line-height:1.7}.book-cover .ornament{color:#bc94a3;font-size:28px;margin:28px}.progress{height:4px;border-radius:10px;background:#f0e5e8;overflow:hidden;margin:22px 0 35px}.progress div{height:100%;background:#a7788c;transition:width .25s ease}.chapter-heading{font-size:25px;line-height:1.7;font-weight:500;margin:18px 0 32px}.chapter-sub{font-size:12px;color:#9c7b8a;letter-spacing:.15em}.chapter-end{margin-top:42px;border-top:1px solid #efe3e8;padding-top:10px}.chapter-menu{margin:22px 0}.chapter-menu summary{cursor:pointer;color:#8d6779;font-size:13px;padding:12px 0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.chapter-menu button{display:block;border:0;border-bottom:1px solid #eee1e5;width:100%;padding:15px 4px;text-align:left;background:transparent;color:#67545e;font-size:14px}.finish{text-align:center;padding:60px 0 0}.finish h2{font-size:29px;font-weight:500;line-height:1.7}.finish p{line-height:2.2}.footer-note{margin-top:35px;font-size:12px;color:#a2949b;line-height:1.9}.quiet{border:0;background:none;color:#927284;font-size:13px;padding:15px 0;margin-top:14px}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* 診断結果：一項目ずつ、明確な解説付きで読む */
.result-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:26px 0 24px}
.result-step{font:inherit;font-size:12px;line-height:1.5;text-align:center;padding:12px 6px;border:1px solid #e4d7d3;border-radius:12px;background:#fffaf8;color:#776e6b;cursor:pointer;min-height:64px}
.result-step.active{background:#654c57;color:white;border-color:#654c57;font-weight:700}
.result-panel{background:#fffdfb;border:1px solid #eaded9;border-radius:18px;padding:23px 19px;margin:0 0 24px;box-shadow:0 10px 30px rgba(77,50,57,.045)}
.result-kicker{font-size:12px;color:#a27b83;letter-spacing:.12em;margin:0 0 8px}
.result-panel-title{font-size:21px;line-height:1.5;margin:0 0 12px;color:#43323a}
.result-explain{font-size:14px;line-height:1.9;color:#75686a;margin:0 0 18px;padding-bottom:15px;border-bottom:1px solid #efe6e1}
.result-panel .prose p{margin-top:0}

</style></head><body><div class="app"><header class="top"><span class="brand">4タイプ診断</span><button id="home" type="button" hidden>最初に戻る</button></header><main id="main" class="main"></main></div><script>
const STORIES={"A":[{"stage":0,"title":"最初に時計を見た人。","body":"「テキパキ」と「理屈」を選んだあなた。話し合いが長引いているとき、ふと時計を見たことはないでしょうか。早く帰りたいから、とは限りません。決まらないまま過ぎていく時間の向こうに、待っている人や、まだ手をつけられていない仕事が見える。何が分かっていて、何が分かっていないのか。どこまで決めれば、みんなが次へ進めるのか。あなたの頭の中では、そんな問いが静かに並び始めます。\n\n誰かが「どうしよう」とつぶやいたとき、あなたは「まず、ここを決めよう」と言うかもしれません。そのひと言で、止まっていた空気が動くことがあります。周りの人には、迷いなく答えを出す人に見えるでしょう。けれど、その短い言葉の前には、いくつもの選択肢を見比べる、あなたなりの時間があったはずです。\n\n速さは、考えの浅さではありません。あなたにとっての速さとは、考えたことを現実に変えるための、ひとつの誠実さなのかもしれません。","note":"この物語は、選んだ2つの答えから広がる一つの見方です。心に重なるところを、そっと受け取ってください。"},{"stage":0,"title":"はっきり言った、そのあとで。","body":"自分の意見をはっきり伝えたあと、相手の表情が少しだけ気になったことはありませんか。会議が終わり、机の上の資料が片づけられ、人が一人ずつ部屋を出ていく。あなたも次の予定へ向かいながら、さっきのひと言を思い返す。「あの言い方で、伝わっただろうか」。\n\n結論を大切にする人は、感情を大切にしない人だと思われることがあります。けれど、言葉を選ぶ余裕がなかった日のことを、後になって考える人もいるでしょう。誰かを傷つけたくなかった。かといって、曖昧なまま進んで、もっと大きな困りごとを残したくもなかった。その二つの思いが、同じ胸の中にあることだってあります。\n\nあなたの強さは、迷わないことだけにあるのではありません。言うべきことを言ったあとにも、その言葉が届いた先を想像できること。もしそんな自分に心当たりがあるなら、それもまた、あなたの大切な一面です。","note":"当てはまる部分も、違う部分も、そのまま大切にしてください。"},{"stage":1,"title":"誰も気づかなかった五分間。","body":"予定が崩れた朝のことを想像してみてください。一本の電話で段取りが変わり、誰かが困った顔をする。あなたは必要な連絡を入れ、順番を組み替え、五分ほどで次の道筋をつくります。やがて一日は何事もなかったように動き始める。\n\n夕方、誰かが「今日は案外、順調だったね」と笑う。その言葉を聞いて、あなたも笑うかもしれません。朝の五分間に自分が何をしたか、わざわざ説明することはないでしょう。\n\n不思議なことに、うまく防げた混乱ほど、誰の記憶にも残りにくいものです。あなたが急いで考えたことも、選び直したことも、穏やかな一日の中に溶けていく。\n\nそれでも、その日を安心して過ごせた人がいたのなら。目に見える成果だけでは測れない仕事が、そこにはあったのではないでしょうか。","note":"思い浮かぶ人や場面はありますか。"},{"stage":1,"title":"頼られる人にも、帰り道がある。","body":"「あなたなら何とかしてくれる」。その言葉を、うれしく感じる日もあるでしょう。自分を信じてもらえることは、力になります。けれど、何度も頼られるうちに、困ったときほど弱音を見せにくくなることもあるかもしれません。\n\n人がいなくなった帰り道。車窓に流れる明かりを眺めながら、ようやく今日の出来事が胸に追いつく。「本当に、あれでよかったのかな」。昼間には答えを出せた問いが、夜になって別の顔を見せる。そんな経験が、もしあるのなら。\n\nそれは、決断が間違っていたという意味ではありません。自分が選んだ道の先に、人の暮らしや気持ちがあることを知っているから、簡単には忘れられないのでしょう。\n\n周りを前へ進める人にも、立ち止まる時間が必要です。あなたが誰かの背中を押してきたように、あなた自身の背中を、そっと支えてくれる人がいてもいいのです。","note":"ここで少しだけ、あなた自身の経験を思い出してみてください。"},{"stage":2,"title":"白と黒のあいだにある色。","body":"物事をはっきりさせたいと思うとき、あなたは何を守ろうとしているのでしょう。約束でしょうか。公平さでしょうか。それとも、誰かが困らない未来でしょうか。\n\n答えを出す力は、ときに「白か黒か」を選ぶ力として表れます。曖昧な言葉のままでは進めない場面も確かにあります。一方で、人の気持ちには、どちらか一つに決められない日があります。やりたいのに不安。うれしいのに寂しい。賛成したいのに、まだ心が追いつかない。\n\nそんなとき、あなたの決断力は、急いで結論を渡すためだけのものではなくなるかもしれません。「今日は、決めないことにしよう」。そう選ぶことも、立派な決断です。\n\n前へ進む道を知っている人が、誰かの歩幅を待てるようになったとき。その強さには、以前とは違う、やわらかな奥行きが生まれます。","note":"思い当たらなくても構いません。自分に重なる部分だけ受け取ってください。"},{"stage":2,"title":"選び直せる人。","body":"決めたことを変えるのは、勇気のいることです。自分で示した道なら、なおさらでしょう。周囲の期待も、昨日の自分の言葉も、簡単には消えません。\n\nそれでも、途中で見えてきた景色が最初と違っていたなら、もう一度考えることができます。「あのときは、こう思っていた。でも、今は違う」。そんな言葉を口にできる人は、弱い人でしょうか。\n\nそうではないはずです。自分の決断を大切にするからこそ、結果を見つめ、必要なら選び直す。その姿勢には、最初に決めるときとは別の強さがあります。\n\n誰より早く歩けることが、あなたの魅力のすべてではありません。間違えたと思ったら戻れること。人の意見を聞いて、景色の見え方を変えられること。そして、やり直す自分を恥じなくていいこと。\n\n未来を切り拓くというのは、一本道を迷わず進むことではなく、自分の足で何度でも道を選べることなのかもしれません。","note":"強さの形は、ひとつではありません。"},{"stage":3,"title":"答えを急がないという選択。","body":"生命保険について考えるとき、いつものあなたの決断力は、少し違った表情を見せるかもしれません。もしもの日に守りたいものは何か。数字だけでは表せない、食卓の声や、何気なく交わす「おかえり」という言葉まで思い浮かべてみる。答えを急ぐあなたが、あえて時間をかけて考えたくなる問いが、そこにはあります。\n\nけれど、そこで大切になるのは、いつもの速さを少しだけ緩めること。結論を急がず、その人が話し終えるまで待つ。生命保険は、単に数字を組み合わせて答えを出すものではなく、その人が守りたい日常について一緒に考える営みでもあるからです。\n\nあなたが得意としてきた決断は、相手の代わりに決めるためではありません。相手が自分の意志で選べるよう、迷いの中に小さな灯りをともすためにある。あの日、誰かの時間を守ろうとして時計を見たあなたなら、その人がこれから過ごす時間の重さにも気づけるのではないでしょうか。","note":"ここでの家族は架空の例です。保障内容や支払条件は商品・契約によって異なります。"},{"stage":3,"title":"自分のために使う、今日の力。","body":"未来を守ることについて考えたあと、ふと今日のことが気になり始める。そんな瞬間があるかもしれません。十年後の安心を願いながら、今日という一日を慌ただしく通り過ぎてしまうことは、誰にでもあるからです。\n\n日々の健康への取り組みを支える仕組みには、自分の状態を知り、歩いた日々を振り返り、続ける楽しみを見つける工夫があります。目標へまっすぐ進むあなたにとっても、今日は何歩歩いたのだろうと足元を確かめる時間は、結果を急ぐためではなく、これから歩き続けるための大切な時間になるのかもしれません。\n\n生命保険について考えたあと、日々の健康を支える仕組みに思いが向かうのは、別の話題に移ることではないのかもしれません。将来を案じる気持ちと、今日を大切にしたい気持ちは、同じ一本の時間の上にあるのです。\n\nいつも前へ進もうとするあなたにも、立ち止まって空を見る日があっていい。誰かの明日のために使ってきた力を、自分の今日のためにも使えるのです。","note":"サービスの内容・利用条件・特典は、公式資料でご確認ください。"},{"stage":3,"title":"あの日、時計を見た理由。","body":"最初に、話し合いの途中で時計を見たあなたの姿を思い浮かべました。決めることが好きだから。時間を無駄にしたくないから。きっと、それだけではなかったのでしょう。\n\nあの部屋の外には、それぞれの人の一日が続いていました。帰りを待つ家族がいて、片づけたい仕事があって、誰にも話していない心配ごとがあったかもしれません。あなたは、その先の時間まで見ようとしていたのではないでしょうか。\n\nもちろん、いつも正しく決められる人などいません。思い切った選択が裏目に出る日も、誰かに助けてもらう日もあるでしょう。それでも、自分の選択を引き受け、必要なら考え直し、また歩き始めることはできます。\n\nもし、誰かの暮らしや安心を支える仕事に心が動くなら、その仕事の喜びだけでなく、難しさや学ぶことについても、ゆっくり話を聞いてみてください。今すぐ何かを決める必要はありません。\n\nあなたは、道を示す人である前に、一人の人です。誰かのために急いだ日も、自分のために立ち止まった日も、同じように大切なあなたの時間です。\n\n次に時計を見るとき、そこには、前へ進むための時間だけでなく、守りたい誰かの時間と、あなた自身の時間が流れているのかもしれません。","note":"仕事への関心はご本人の自由です。無理に勧めるための診断ではありません。"}],"B":[{"stage":0,"title":"机の上に残された、小さな付箋。","body":"「じっくり」と「理屈」を選んだあなた。何かを決める前に、まず確かめておきたいことが浮かぶのではないでしょうか。値段だけでなく、その理由。便利さだけでなく、長く使えるかどうか。誰かの「きっと大丈夫」という言葉を疑いたいのではありません。その言葉を、自分でも信じられるところまで理解したいのです。\n\n例えば、友人たちと出かける計画を立てる夜。楽しそうな写真を眺める人の隣で、あなたは乗り換えの時間や帰りの交通手段を調べているかもしれません。画面の端には、小さな付箋。集合時刻、予約番号、雨が降ったときの行き先。誰に見せるでもなく書き留めたその文字を、出発の朝にもう一度確かめる。\n\nそれは、心配性だからでしょうか。そういう面もあるのかもしれません。けれど、あなたが本当に望んでいるのは、心配することではなく、心配せずに笑える時間なのではないでしょうか。準備を終えたあと、何も気にせず景色を眺められること。隣の人が「楽しかったね」と言ってくれること。\n\nあなたの慎重さは、楽しみの反対側にあるものではありません。楽しみを、安心して迎えるための静かな仕事なのです。","note":"この物語は、選んだ2つの答えから広がる一つの見方です。心に重なるところを、そっと受け取ってください。"},{"stage":0,"title":"「どうして？」を大切にしてきた人。","body":"子どもの頃から、理由が分からないまま「そういうものだから」と言われると、どこか落ち着かなかったことはありませんか。答えそのものより、そこへ至る道筋が知りたい。人が当たり前に通り過ぎるところで立ち止まり、小さな疑問を拾い上げる。\n\n大人になると、その姿勢が「細かいね」と言われることもあります。皆がもう決めたつもりでいるときに、あなたはまだ資料の一行を見つめている。聞き返したいことがあっても、場の流れを止めてしまわないかと迷う。口を開くまでの短い時間に、いくつもの考えが行き来しているのかもしれません。\n\nそれでも、分からないことを分かったふりで通り過ぎたくない。あなたにとって納得とは、単に正しい答えを手に入れることではないのでしょう。自分の選択に、自分で責任を持つための大切な約束なのだと思います。\n\n誰かの言葉をそのまま借りるより、自分の中で一度確かめてから話したい。その誠実さは、目立つ才能ではないかもしれません。けれど、言葉に重みが生まれるのは、きっとそういう時間を通ってきたからです。","note":"当てはまる部分も、違う部分も、そのまま大切にしてください。"},{"stage":1,"title":"何も起きなかった日のこと。","body":"予定どおりに進んだ一日は、案外すぐに忘れられてしまいます。列車に乗り遅れなかったこと。必要なものがそろっていたこと。誰も道に迷わず、約束の場所にたどり着けたこと。\n\nその裏側に、あなたが確かめた時刻や、前日に送った短い連絡があったとしても、誰かがそれを思い出すとは限りません。「助かったよ」と言われることもなく、ただ一日が穏やかに終わる。\n\nそんなとき、少しだけ物足りなく感じることはないでしょうか。手間をかけたことが、誰の目にも映らなかったような気がして。\n\nけれど、起きなかった出来事には、名前がありません。忘れ物をしなかったことも、困らずに済んだことも、記憶の中ではただの平凡な一日になる。それでも、その平凡さを支えた人がいたのです。\n\nあなたが守ってきたものの中には、誰にも知られないまま、確かに誰かの暮らしを軽くしたものがあるのかもしれません。","note":"思い浮かぶ人や場面はありますか。"},{"stage":1,"title":"答えを出したあとに、残るもの。","body":"十分に考えて選んだはずなのに、夜になってもう一度確かめたくなることはありませんか。送ったメールの文面。交わした約束。あのとき選ばなかった別の道。\n\n考え抜く人の心は、決めた瞬間に静かになるとは限りません。むしろ、決めたからこそ見えてくる責任があります。もし違っていたら。もし誰かに迷惑をかけたら。そんな問いが、眠る前の部屋にそっと戻ってくる。\n\n周囲には落ち着いて見えるあなたが、心の中では何度も同じ場面をたどっている。誰かが「気にしすぎだよ」と笑えば、あなたも笑ってうなずくかもしれません。でも、簡単に手放せないのは、その出来事を大切に思っているからでもあるのでしょう。\n\n慎重さには、疲れを伴う夜があります。そのことまで美しい才能として飾る必要はありません。あなたが十分に考えたなら、考えることを休む時間も、同じように大切です。","note":"ここで少しだけ、あなた自身の経験を思い出してみてください。"},{"stage":2,"title":"誰かの「大丈夫」に、理由を添える。","body":"あなたのそばに、思いついたらすぐに動き出す人がいるかもしれません。楽しそうな計画を次々と口にし、迷いなく扉を開けていく人。その軽やかさが、少しまぶしく見える日もあるでしょう。\n\n一方で、その人が見落としていた小さな段差に、あなたは気づくことがあります。予算が足りるか。時間は間に合うか。困ったとき、誰に連絡すればいいか。\n\nあなたの問いは、ときにブレーキのように受け取られるかもしれません。けれど本当は、行きたい場所を否定しているのではなく、そこへ無事にたどり着く道を探しているのでしょう。\n\n「大丈夫だと思う」という言葉に、確かめた理由を一つ添える。それだけで、誰かは安心して前へ進めることがあります。あなた自身も、すべてを調べ尽くすまで立ち止まる必要はありません。人のひらめきに少し身を預けてみることが、新しい景色につながる日もあるはずです。\n\n異なる歩幅が並ぶとき、どちらかが正しく、どちらかが間違っているわけではありません。あなたの確かさと、誰かの軽やかさが出会うところに、まだ知らない道が生まれるのです。","note":"思い当たらなくても構いません。自分に重なる部分だけ受け取ってください。"},{"stage":2,"title":"地図に描かれていない道。","body":"どれほど丁寧に準備しても、予定どおりにいかない日は訪れます。晴れるはずだった空から雨が降り、頼りにしていた店が休みで、調べた道が工事中になっている。\n\nそんなとき、あなたは少し悔しくなるかもしれません。あれだけ調べたのに、と。もっと早く気づけたのではないか、と。\n\nけれど、人生には、最初から資料のない出来事があります。大切な人の気持ちも、自分の将来も、正しい答えが一つに定まるとは限りません。調べるほど選択肢が増えて、かえって迷うことさえあるでしょう。\n\nそのとき必要なのは、考える力を捨てることではなく、考え抜いた自分を信じることなのかもしれません。今分かっていることを確かめ、分からない部分があると認め、それでも自分の足で一歩を選ぶ。\n\nあなたが大切にしてきた誠実さは、完璧な答えを出せた日にだけ宿るものではありません。答えのない場所で、誰かと相談しながら進むときにも、静かに息づいているのです。","note":"強さの形は、ひとつではありません。"},{"stage":3,"title":"数字の向こうにいる人。","body":"机の上の付箋には、集合時刻や乗り換えの順番だけでなく、誰かに確認しておきたい小さな疑問が書かれていたかもしれません。あなたはその一つを消すたびに、胸の中に静かな安心が生まれるのを知っています。\n\n生命保険について考えるときにも、よく似た瞬間があります。「もしものときが心配で」という気持ちを、すぐに数字へ置き換えるのではなく、何が心配なのか、誰との暮らしを守りたいのか、一つずつ確かめていく。必要な保障を考えるには、根拠も条件も大切です。けれど、資料の余白に書き留めた何気ない言葉が、数字以上にその人の願いを教えてくれることもあるでしょう。\n\n例えば、相談の終わりに「これで少し安心できました」と言われた日。あなたは説明した内容に間違いがなかったか、帰り道でもう一度振り返るかもしれません。その慎重さは、ただ失敗を避けたいからではない。相手の人生を、軽い言葉で扱いたくないからです。\n\nあなたの付箋は、正解を忘れないためだけの紙ではありません。誰かの大切なものを、見落とさないための小さな約束でもあるのです。","note":"保障内容や支払条件は商品・契約によって異なります。"},{"stage":3,"title":"自分のために、余白を残す。","body":"将来の備えを丁寧に考えたあとで、別の問いが浮かぶことがあります。守りたい未来へ向かう途中の、今日という日はどうだろう、と。\n\n生命保険が将来の不安に備えるための一つの方法だとすれば、日々の健康への取り組みを支える仕組みは、今の自分を知るきっかけになります。健康状態を確かめ、歩いた距離を振り返り、小さな達成を楽しみに変える。そんな仕組みの中にも、あなたの得意な「確かめながら進む」という姿勢が息づいています。あなたなら、何となく始めるのではなく、無理のない歩数や続けやすい時間帯を考えるかもしれません。雨の日のことまで思い浮かべて、予定に少し余白を残すでしょう。\n\nある朝、いつもより一駅手前で降りて歩いたとします。昨日より歩けたかどうかを確かめようとして、ふと顔を上げる。街路樹の葉が、先週とは少し違う色をしている。その変化は、どんな表にも書かれていなかったものです。\n\n計画する力は、人生を予定表どおりに進めるためだけにあるのではありません。予想していなかった美しさに出会う余裕を、自分に残すためにもある。\n\n誰かの未来を守る仕事と、自分の今日を大切にする習慣。その二つを結ぶのは、あなたが昔から大切にしてきた「確かめる」という小さな行為なのかもしれません。","note":"サービスの内容・利用条件・特典は、公式資料でご確認ください。"},{"stage":3,"title":"あの付箋を、そっと外す日。","body":"最初に思い浮かべた、小さな付箋のことを覚えているでしょうか。集合時刻、予約番号、雨の日の行き先。誰にも頼まれずに書き留めた、あの短い言葉たち。\n\n旅の終わり、あなたはその付箋を外すかもしれません。予定していた場所には全部行けなかった。思いがけない寄り道もした。それでも、帰り道で誰かが笑っていたなら、あなたの準備は、十分に役目を果たしたのでしょう。\n\nもしかすると、付箋に書かなかった出来事のほうが、長く心に残るかもしれません。急な雨を避けて入った小さな店。道を間違えた先で見つけた景色。誰かが何気なく話してくれた、忘れられない一言。\n\n確かな道を描くことができるあなたには、描いていなかった道を楽しむ力も、きっと育っていきます。自分で調べて、自分で選ぶ。その誠実さを持ったまま、時には誰かの手を借り、思いがけない景色に出会っていいのです。\n\nもし、人の暮らしや未来を支える仕事に関心が芽生えたなら、喜びだけでなく難しさや学ぶことまで、納得するまで聞いてみてください。選ぶかどうかは、あなた自身が決めることです。\n\nあの付箋は、間違えないためだけのものではなかったのでしょう。大切な時間を、心から楽しむために書いたものだったのです。\n\nそして今度は、あなた自身のこれからにも、少しだけ書き込みのない余白を残してみる。そこにどんな景色が現れるのか、まだ誰にも分かりません。","note":"仕事への関心はご本人の自由です。無理に勧めるための診断ではありません。"}],"C":[{"stage":0,"title":"予定にない道を選ぶ人。","body":"待ち合わせまで、まだ少し時間がある。いつもの道を歩けば間に合うと分かっているのに、角の向こうに見慣れない小さな店を見つけた途端、足がそちらへ向かう。ガラス越しに並んだ色とりどりの花。誰かに教えたくなるような、朝の光。あなたには、そんなふうに心が先に動く瞬間があるのではないでしょうか。\n\n「テキパキ」と「気持ち」を選んだあなた。何かを始める理由は、必ずしも十分な説明がつくことばかりではありません。面白そう。会ってみたい。きっと喜んでもらえる。胸の中に生まれた小さな予感が、次の一歩を決めることもあるでしょう。\n\n人はそれを気まぐれと呼ぶかもしれません。けれど、まだ形になっていない楽しさを見つけられることは、立派な感受性です。あなたが立ち止まった場所に、ほかの誰かが気づかなかった景色がある。そう考えると、寄り道にも、その人らしい理由があるのだと思います。\n\nもちろん、いつも冒険を選ぶとは限りません。今日のあなたが少し疲れているなら、いつもの道が心地よい日もあるでしょう。それでも、知らない景色に胸が弾む感覚は、あなたの中のどこかに静かに残っているのかもしれません。","note":"どんな場面が、あなたの記憶に浮かびましたか。"},{"stage":0,"title":"笑い声が消えたあとに。","body":"集まった人たちの会話が途切れたとき、ふと口にした一言で空気がやわらぐ。誰かが笑い、隣の人もつられて笑う。あなたは、そんな瞬間を思いがけず生み出すことがあるかもしれません。\n\n話すのが得意だからというだけではないのでしょう。誰が退屈そうにしているか、誰が会話に入りたそうにしているか。理屈で整理する前に、表情や声の調子から感じ取る。あなたの明るさには、周囲の気配を受け取る繊細さが隠れていることがあります。\n\nところが、楽しい時間が終わり、ひとりになった帰り道で、急に静けさが訪れることもある。「あの人は、本当は楽しめていただろうか」。さっきまで笑っていた自分が、誰かの小さな沈黙を思い出す。\n\n明るい人は悩まない、と決めつけられたら少し困りますね。あなたにも、言葉を探す夜があっていい。人を楽しませることと、いつでも楽しい気持ちでいることは、同じではありません。笑い声のあとに訪れる静けさも、あなたという人の大切な一部分です。","note":"誰かの笑顔を思い出す時間があってもいいですね。"},{"stage":1,"title":"一通の短いメッセージ。","body":"何気なく送った「元気にしてる？」という一言を、あなた自身は忘れてしまうかもしれません。ところが受け取った人は、その日、誰にも話せないことを抱えていたかもしれない。返事はいつもどおりの短い言葉。それでも画面の向こうで、少しだけ肩の力が抜けていたとしたら。\n\n人と人との関係は、特別な言葉だけで深まるものではありません。思い出したから連絡する。おいしいものを見つけたから知らせる。偶然会った人に、昨日の続きを尋ねる。あなたの直感的な行動には、相手を一人にしない力が宿ることがあります。\n\n一方で、すべての人に気を配らなくても大丈夫です。返事を待たずに過ぎる日もあれば、こちらから連絡する元気がない日もある。関係は、いつも同じ温度で続く必要はありません。\n\n大切なのは、あなたの言葉が完璧だったかどうかではなく、その人を思い浮かべた瞬間が確かにあったこと。小さなメッセージには、ときに長い手紙にも負けない温かさがあります。","note":"小さな一言が残した温かさを、思い返してみてください。"},{"stage":1,"title":"新しい景色が好きな理由。","body":"同じことを繰り返していると、窓の外が気になる。新しい方法を思いつくと、試さずにはいられない。そんな自分を「飽きっぽいのかな」と考えたことがあるかもしれません。\n\nけれど、あなたが探しているのは、単なる刺激だけではないのでしょう。昨日より面白い今日。昨日は話せなかった人と笑い合える午後。変わることで、まだ出会っていない可能性に触れられる。そうした予感が、あなたを動かしているのかもしれません。\n\nもちろん、ひらめきがいつも正解とは限りません。勢いで始めて、途中で立ち止まる日もあるでしょう。そんなとき、自分を責めるより、何に心が動いたのかを振り返ってみる。その発見は、次の選択を少し確かなものにしてくれます。\n\n自由とは、何にも縛られないことだけではありません。自分が大切にしたいものを知り、そのために必要な約束を選び取ることでもあります。あなたのひらめきが、誰かとの信頼の中で育っていく未来もあるのです。","note":"新しい景色に心が動いた日のことを、覚えていますか。"},{"stage":2,"title":"いつも笑っている人、という役割。","body":"「あなたがいると明るくなるね」。そう言われて、うれしかったことがあるかもしれません。誰かの表情がほころぶ瞬間に立ち会えるのは、幸せなことです。\n\nけれど、その言葉がいつしか小さな役割になることもあります。場が静かになると何か話さなくてはと思う。疲れていても、いつもの自分でいようとする。そんな日がもしあるなら、あなたの笑顔は少し頑張りすぎているのかもしれません。\n\n人は、明るい人の寂しさを見落とすことがあります。誰かを元気にする人も、誰かに気づいてほしい日がある。楽しさを届ける手と、安心を受け取る手は、同じあなたの手なのです。\n\n無理に弱さを見せる必要はありません。ただ、何も面白いことを言わなくても、隣にいてくれる人がいるとしたら。その沈黙は、あなたが思うよりずっと豊かな時間かもしれません。\n\nあなたの価値は、笑わせた人数でも、会話を盛り上げた回数でも測れません。笑わないあなたにも、変わらない居場所があっていいのです。","note":"笑顔のない日も、あなたの大切な一日です。"},{"stage":2,"title":"楽しさの向こうにある約束。","body":"人との約束を大切にする気持ちは、必ずしも堅苦しい形で現れるわけではありません。約束した日の朝、少し早く起きてしまう。相手が好きだと言っていたものを、通りがかりに見つけてうれしくなる。あなたには、そんな心の動きがあるかもしれません。\n\n気持ちを優先する人は、その場の勢いだけで生きていると思われがちです。けれど、本当に大切な相手のことになると、驚くほど粘り強くなれる人もいます。自分の楽しさだけではなく、相手が安心して笑えることを願う。その願いが、自由な心に一本の芯を通していくのです。\n\n相手のために何かをしたいと思ったとき、少しだけ立ち止まって「この人は何を望んでいるだろう」と考える。そのひと呼吸が、あなたの直感を、さらに深い思いやりへと変えてくれるかもしれません。\n\n思いつきから始まった行動が、いつか誰かとの長い信頼になる。最初は小さな寄り道だった道が、気づけば大切な人へ続いている。そんなことも、人生にはあるのでしょう。","note":"あなたが守りたい約束は、どんなものでしょう。"},{"stage":3,"title":"未来の話を、今日の言葉で。","body":"ある日、親しい人と何気ない会話をしているとき、「もしものことって、考えたことある？」という話題が出たとします。さっきまで笑っていた相手が、少し言葉を探す。あなたも、すぐには答えが見つからないかもしれません。\n\n生命保険は、数字や条件を確認する大切さとともに、その数字の向こうにいる人の暮らしを考えるものでもあります。守りたい家族の食卓。いつもどおりに迎えたい朝。これからも続いてほしい、ささやかな時間。\n\n人の表情の変化に気づきやすいあなたなら、相手がまだ言葉にできない気持ちに耳を傾けられる場面があるかもしれません。話を明るくすることだけが、寄り添う方法ではありません。相手が真剣に考えたいとき、その静けさを一緒に受け止めることも、温かな関わりです。\n\n生命保険を考える時間は、暗い未来を想像するだけの時間ではないのでしょう。何を失いたくないのかを考えることで、いま手元にある幸せの輪郭が見えてくる。あなたが大切にしてきた「楽しい今日」もまた、守りたい未来の一部なのです。","note":"大切な暮らしの風景を、一つ思い浮かべてみてください。"},{"stage":3,"title":"今日を楽しむことにも、理由がある。","body":"未来の安心を考えたあと、話題が今日の暮らしへ戻ってくる。明日のことを大切にするなら、今日をどう過ごすかも大切になるからです。\n\n健康づくりを応援する仕組みには、歩いた一日を振り返ったり、小さな達成に楽しみが待っていたりするものがあります。いつもと違う道を選ぶ。気になっていた公園まで足を延ばす。数字を確かめるだけだった歩みが、いつしか新しい景色との出会いになる。楽しさを見つけるのが得意なあなたなら、そんな変化にも心を弾ませるのかもしれません。\n\n生命保険が「これからも守りたい暮らし」を考えるきっかけになるとしたら、日々の健康を楽しみながら支える仕組みは「その暮らしを、今日どう味わうか」を考える入り口にもなります。二つの話は、遠く離れているようで、実は同じ時間の上にあるのです。\n\n健康への向き合い方は、人それぞれです。数字を追うことが楽しい日も、休むことが必要な日もあるでしょう。あなたらしい健やかさは、誰かと競って決めるものではありません。\n\nあの日、予定になかった花屋の前で立ち止まったように。今日の中にも、まだ見つけていない小さな喜びがあるのかもしれません。","note":"健康づくりの方法や利用条件は、公式資料でご確認ください。"},{"stage":3,"title":"寄り道の先に、帰る場所がある。","body":"人生には、予定どおりに進んだ日の記憶より、思いがけず立ち止まった場所の景色が残ることがあります。知らない道。初めて交わした言葉。ふいに笑い合った午後。あなたは、そんな偶然を大切にしてきたのかもしれません。\n\nその一方で、どれほど新しいものが好きでも、帰ってきたい場所はあるのでしょう。何も説明しなくても分かってくれる人。いつもの声で「おかえり」と言ってくれる人。自由に歩けるのは、安心して戻れる場所があるからかもしれません。\n\n生命保険で考える未来への備えも、日々の健康づくりを通じて見つめる今日の健やかさも、結局はそんな日常につながっています。遠い明日を守りたいのは、今日の笑顔が大切だから。今日を楽しみたいのは、その時間が永遠ではないと、どこかで知っているから。\n\nあなたの明るさは、いつも笑っていることではありません。世界の中にまだ残っている喜びを、誰かと見つけようとすることです。\n\n次に角を曲がるとき、また知らない景色があるかもしれません。そのときあなたは、きっと少しだけ立ち止まるでしょう。そして、誰かに見せたいと思うのです。その景色を。","note":"今日のあなたに、心に残った言葉があれば幸いです。"}],"D":[{"stage":0,"title":"返事を急がなかった人。","body":"誰かに相談を持ちかけられたとき、あなたはすぐに答えを返すより、まず最後まで聞こうとすることがあるのではないでしょうか。相手が言葉を探しているあいだ、急かさずに待つ。窓の外の光が少し変わっても、話の続きを遮らない。\n\n「じっくり」と「気持ち」を選んだあなた。物事を決めるとき、自分の都合だけではなく、そこにいる人の気持ちが気になるのかもしれません。誰かが納得できないまま話が進んでしまうことに、心が落ち着かない。そんな優しさを持つ人もいるでしょう。\n\nただ、穏やかであることは、何も考えていないことではありません。相手の言葉を聞きながら、あなたの中にもいくつもの思いが生まれている。賛成できることも、少し違うと思うこともある。それでも、相手の話が終わるまでは、その気持ちを大切にしておきたい。\n\nすぐに答えを出さない時間にも、確かな意味があります。人の話を最後まで聞くことは、その人の人生を急いで片づけないという、静かな約束なのかもしれません。","note":"言葉を待ってもらえた日のことを、思い出してみてください。"},{"stage":0,"title":"小さな違和感を覚えていた。","body":"集まりの帰り際、みんなが笑って別れたあとで、一人だけいつもより口数が少なかったことを思い出す。あなたには、そんな小さな違和感が心に残る日があるかもしれません。\n\n「大丈夫だったかな」。連絡を入れようか迷い、相手の時間を邪魔してしまわないかと考える。何もせずにいることが冷たいわけでも、声をかけることだけが正しいわけでもない。その間で丁寧に考えるのが、あなたらしいところなのでしょう。\n\n周囲には、いつも落ち着いている人に見えるかもしれません。けれど、穏やかな表情の内側で、人知れず気を配っていることもある。誰かの気持ちを軽く扱いたくないという思いは、ときに自分自身を疲れさせるほど真剣なものです。\n\nすべてに気づく必要はありません。気づいたことの全部に応えなくてもいい。それでも、誰かの小さな沈黙を覚えているあなたの心には、人を大切にするための静かな明かりがともっているのかもしれません。","note":"小さな気づきに、いつも応える必要はありません。"},{"stage":1,"title":"何も言わずに置いた一杯。","body":"疲れて帰ってきた人の前に、そっと温かい飲み物を置く。励ましの言葉を探すより、その人が一息つける場所をつくりたい。あなたの優しさは、そんな形で表れることがあるかもしれません。\n\n何も言わなかったから、何もしていないわけではありません。相手が話し始めるのを待つことも、今は聞かないと決めることも、心を向ける一つの方法です。\n\n人の記憶には、不思議な残り方をする出来事があります。何を話したかは忘れても、あのとき手のひらに伝わったカップの温かさだけは覚えている。誰かの心に残るのは、立派な助言よりも、安心して黙っていられた時間なのかもしれません。\n\nあなたが大切にしてきたのは、誰かを変えることではなく、その人が自分の気持ちを取り戻すまでそばにいること。そうした時間の積み重ねが、目には見えない信頼になっていくのでしょう。","note":"言葉にならない優しさも、確かにあります。"},{"stage":1,"title":"譲れないものは、静かな場所にある。","body":"周囲に合わせることが多いからといって、何にでも賛成しているわけではない。あなたにも、どうしても譲れないことがあるのではないでしょうか。\n\n誰かを傷つける言葉。弱い立場の人が置き去りにされること。大切な約束が、何事もなかったように忘れられること。普段は穏やかなあなたが、そんな場面でだけ、静かに表情を変えることもあるかもしれません。\n\n声を荒らげずに「それは違うと思います」と伝える。あるいは、無理に争わず、その場から距離を置く。どちらも、自分が大切にしているものを守る選択です。\n\n人と争わないことは、自分を持たないことではありません。むしろ、簡単には揺らがないものが心の奥にあるからこそ、日常の小さな違いを受け止められる人もいるのでしょう。\n\nあなたの強さは、いつも前に出てくるとは限りません。必要なときに、静かな場所から姿を現す。その強さを、あなた自身が見落とさないでいてほしいのです。","note":"あなたが大切にしているものは、何でしょう。"},{"stage":2,"title":"「大丈夫」のあとに残るもの。","body":"「大丈夫です」。その言葉を口にしたあと、胸の中に小さな引っかかりが残ったことはありませんか。相手に心配をかけたくなかった。話を長引かせたくなかった。理由はいくつもあるでしょう。\n\n人の気持ちを大切にする人ほど、自分の願いを後回しにすることがあります。けれど、あなたの気持ちも、ほかの誰かの気持ちと同じように大切です。\n\n本当は少し休みたかった。本当は別の道を選びたかった。そんな思いがあったとしても、すぐに言葉にできなかった自分を責める必要はありません。自分の本音に気づくまで、時間がかかることもあるからです。\n\n「今日は少し考えさせてください」。その短い一言を言えるようになったとき、あなたの優しさは失われるでしょうか。きっと、そうではありません。相手を尊重することと、自分を大切にすることは、同じ場所に並べておけるのです。\n\n誰かの返事を待ってきたあなたなら、自分の心の返事も、急がずに待ってあげられるのではないでしょうか。","note":"自分の返事を待つ時間も、大切にしていいのです。"},{"stage":2,"title":"長い時間が育てたもの。","body":"初めて会ったときには、あまり話さなかった相手が、何度も顔を合わせるうちに少しずつ本音を見せてくれる。あなたは、そんな関係の変化に喜びを感じることがあるかもしれません。\n\n信頼は、劇的な出来事だけで生まれるものではありません。約束した時間を守る。相手の話を覚えている。うれしい日だけでなく、うまくいかない日にも態度を変えない。目立たない一つひとつが、時間をかけて関係を育てます。\n\nもちろん、すべての人と深くつながる必要はありません。どれほど丁寧に接しても、分かり合えないことはあります。そんなときに距離を置くことも、自分と相手を尊重する方法です。\n\nあなたが築く信頼は、何でも受け入れることで成り立つのではありません。互いの違いを知り、それでも安心して話せる場所を少しずつつくっていく。その時間の長さこそ、あなたの魅力を物語っているのでしょう。","note":"信頼が育った瞬間を、思い浮かべてみてください。"},{"stage":3,"title":"守りたいのは、数字の向こうの暮らし。","body":"大切な人の将来について考えるとき、すぐには言葉にならない気持ちがあります。何が心配なのか、何を守りたいのか。自分でもまだ整理できていないことがあるでしょう。\n\n生命保険の話も、最初から数字だけで始まるものではないのかもしれません。いつもの食卓が続くこと。子どもが好きな道を選べること。残される人が、自分の暮らしを大切にできること。その人によって、思い浮かべる景色は違います。\n\nあなたのように相手の言葉を急がせない人なら、まだ形にならない思いを一緒に整理する場面で、その丁寧さが役立つかもしれません。ただ、気持ちに寄り添うことと、保障の内容を正確に伝えることは、どちらも欠かせません。優しさは、確かな知識と出会うことで、さらに信頼できるものになります。\n\n未来を考えることは、怖い出来事を想像するためだけではありません。今日、大切にしているものを確かめる時間でもあるのです。誰かの返事を待つあなたの姿勢は、人生の大切な選択を、その人自身のものとして尊重する姿勢につながっていきます。","note":"保障の内容や条件は、商品・契約によって異なります。"},{"stage":3,"title":"今日の歩幅を、誰かと比べない。","body":"未来への安心を考えたあと、ふと今日の暮らしに目を向けてみる。遠い先のことを思う気持ちと、今この瞬間を大切にしたい気持ちは、別々のものではないからです。\n\n日々の健康への取り組みを支える仕組みには、自分の体の状態を知り、歩くことを続け、その小さな積み重ねを楽しみに変える工夫があります。誰かと歩幅を競わなくてもいい。昨日より少し遠くまで歩けた日も、疲れて休んだ日も、自分の暮らしを見つめる大切な一日です。そんな静かな続け方は、あなたの感覚にもどこか重なるかもしれません。\n\n生命保険が、もしものときにも守りたい未来を考えるものなら、健康づくりを楽しみながら続ける仕組みは、その未来へ続く今日を見つめる入り口にもなります。大切な人の明日を願うことと、自分の今日をいたわること。その両方があっていいのです。\n\n健やかさの形は、一人ひとり違っていていいのです。昨日より歩けた日があっても、休息が必要な日があってもいい。誰かと競うためではなく、自分の体と心に耳を傾けるための時間であってほしいと思います。\n\nいつも人の歩幅に合わせてきたあなた。今日だけは、自分の歩幅を確かめながら歩いてみる。そんな静かな時間も、きっと大切です。","note":"健康づくりの方法や利用条件は、公式資料でご確認ください。"},{"stage":3,"title":"あの日、待っていた時間の意味。","body":"誰かが言葉を探していた、あの日のことを思い出してみてください。あなたは答えを急がず、ただ話の続きを待っていた。窓の外の光が少し変わっても、その時間を惜しいとは思わなかったかもしれません。\n\nあの沈黙には、何があったのでしょう。言えなかった思い。ようやく口にできた本音。相手が自分自身の気持ちに追いつくまでの、かけがえのない時間。\n\n人の人生は、誰かが代わりに決められるものではありません。生命保険について考えるときも、日々の健康を支える仕組みについて考えるときも、最後に大切なのは、その人が自分の歩幅で選べることなのでしょう。\n\nあなたはこれまで、誰かの歩幅を守ってきたのかもしれません。急がせず、比べず、答えが出るまでそばにいる。その優しさは、思っている以上に深い強さです。\n\nそして、忘れないでほしいことがあります。あなたにも、待ってもらっていい時間があるということです。答えが出ない日も、何も言いたくない夜も、自分を急かさなくていい。\n\nあの日、あなたが誰かに渡した静かな時間を、これからはあなた自身にも。その時間の中で、まだ知らなかった自分の願いが、そっと言葉になるかもしれません。","note":"自分自身に贈りたい時間を、そっと思い浮かべてみてください。"}]};
const INTRO={"A":["あなたは、迷いの中に道をつくる人。",["話し合いが長くなったとき、誰かが困っているとき。「それなら、こうしてみようか」と、自然に次の一歩を考えていることはありませんか。決めるべきことを整理し、動き始める。その姿を、周りの人は頼もしいと感じているかもしれません。","でも、すぐに答えを出せる人が、迷わない人とは限りません。あの言い方でよかっただろうか。もっと別の道があったのではないか。人には見せなかった問いを、帰り道でひとり抱えたこともあるでしょう。前へ進む人ほど、立ち止まる自分を誰にも見せられないときがあります。","そんなあなただからこそ、実は、誰かの「まだ決められない」という気持ちも分かるのではないでしょうか。あなたの強さは、誰より早く正解を出すことだけではありません。迷いを知りながら、それでも大切なものを守るために一歩を選べること。その一歩の先に、まだあなた自身も知らない景色があります。"]],"B":["あなたは、見えない安心をつくる人。",["何かを選ぶとき、少し調べてから決めたい。小さな違いが気になり、理由が分かるとようやく心が落ち着く。そんな自分を、慎重すぎると思ったことはありませんか。でもあなたが確かめてきたことのおかげで、誰かが安心して過ごせた日もあったはずです。","丁寧に考える人の仕事は、うまくいったときほど目立ちません。何も起こらなかった一日の陰に、あなたの準備がある。けれど、どれほど考えても答えの出ないことがあり、「もっと早く決められたら」と自分を急かしてしまう夜もあるかもしれません。","そんなあなただからこそ、実は、不確かな未来にも向き合える力を持っているのだと思います。すべてを知ってから歩くのではなく、大切なものを確かめたうえで、分からない部分も抱えて歩いていく。あなたが重ねてきた小さな確認は、いつか誰かの人生を支える、静かな信頼になっているのかもしれません。"]],"C":["あなたは、まだない景色を見つける人。",["いつもと違う道を通ってみたくなる。誰かの何気ない一言から、新しい楽しみを思いつく。気づけば、その場の空気を少し明るくしている。あなたにとっては自然なことでも、そんな瞬間を楽しみにしている人がいるのかもしれません。","けれど、明るい人が、いつも明るい気持ちでいるとは限りません。みんなが笑っているときほど、ひとりだけ黙っている人が気になる。自分が笑っていれば大丈夫、と本当の気持ちをしまい込んだ日もあるでしょう。誰かの笑顔を願う心は、ときに思った以上に繊細です。","そんなあなただからこそ、実は、にぎやかな時間だけでなく、誰かの静けさも大切にできるのではないでしょうか。あなたの魅力は、いつも人を楽しませることではありません。まだ誰も気づいていない喜びを見つけ、ときには何も言わず隣にいられること。次の角を曲がった先に、あなた自身のための景色も待っています。"]],"D":["あなたは、人の心に残る人。",["誰かが話しているとき、言葉そのものより、その奥にある気持ちが気になることはありませんか。相手が笑っていても、少し無理をしているように見える。みんなが先へ進もうとするとき、ひとり立ち止まる人に気づく。あなたには、それが特別なことではないのかもしれません。","けれど、人の気持ちを考えるあまり、自分の答えを後回しにしてしまうこともあるでしょう。本当は言いたかった言葉を飲み込み、あとになって「あれでよかったのだろうか」と思い返す。穏やかな人の心の中にも、簡単には片づけられない思いがあります。","そんなあなただからこそ、実は、誰かがまだ言葉にできない思いを受け止められるのではないでしょうか。すぐに答えを出さないことは、弱さだけではありません。人が自分の気持ちを話せるのは、急がず待ってくれる人がいるから。そして、あなた自身にも、待ってもらっていい時間があるのです。"]]};
const NAMES={"A":"決断力で未来を切り拓くタイプ","B":"分析力で確かな道を描くタイプ","C":"ひらめきで笑顔を広げるタイプ","D":"思いやりで信頼を育むタイプ"};
let q1=null,q2=null,view='welcome',chapter=0,resultStep=0;const main=document.getElementById('main'),home=document.getElementById('home');
function e(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function add(parent,...items){items.forEach(x=>parent.append(x));return parent}
function b(txt,fn,cls='btn'){const n=e('button',cls,txt);n.type='button';n.onclick=fn;return n}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function reset(){q1=q2=null;chapter=0;resultStep=0;go('welcome')}
function type(){return q1===0?(q2===0?'A':'C'):(q2===0?'B':'D')}
function paragraphs(parent,txt){txt.split(/\n\n+/).forEach(t=>{if(t.trim())parent.append(e('p','',t))})}
function render(){main.replaceChildren();home.hidden=view==='welcome';home.onclick=reset;
 if(view==='welcome'){add(main,e('p','eyebrow','2つの質問から始まる、あなたの物語'),e('h1','hero','あなたの魅力には、\nまだ続きがある。'),e('p','lead','何気ない選択の中に、まだ知らなかった自分がいるかもしれません。\n\n答えるのは、たった2つの質問。'),b('診断をはじめる',()=>go('q1')));return}
 if(view==='q1'||view==='q2'){const first=view==='q1';add(main,e('p','eyebrow',first?'最初の質問':'最後の質問'),e('h1','hero',first?'何かをするとき、どちらが自分に近いですか？':'何かを決めるとき、どちらを優先しますか？'));
 (first?['テキパキ','じっくり']:['理屈','気持ち']).forEach((x,i)=>main.append(b(x,()=>{if(first){q1=i;go('q2')}else{q2=i;resultStep=0;go('result')}},'choice')));add(main,e('p','muted','正解はありません。今の自分に近い方を選んでください。'),b('前の画面に戻る',()=>go(first?'welcome':'q1'),'quiet'));return}
 const t=type(); if(view==='result'){
 const labels=['あなたに見られる傾向','あなたの心の奥にあるもの','そんなあなただからこそ'];
 const explains=['まず、普段の行動や考え方に目を向けます。あなたが何気なく選んでいることには、あなたらしさが表れているかもしれません。','次に、周囲からは見えにくい気持ちに目を向けます。得意なことの裏側にある迷いや葛藤も、大切なあなたの一部です。','最後に、その傾向の奥にある可能性を見つめます。弱さだと思っていた一面にも、誰かを支える力が隠れているかもしれません。'];
 const cover=e('section','cover');
 add(cover,e('p','eyebrow','あなたの診断結果'),e('div','type-letter',t+' TYPE'),e('h1','result-heading',NAMES[t]),e('h2','intro-title',INTRO[t][0]));
 const nav=e('div','result-steps');nav.setAttribute('aria-label','診断結果の3つの項目');
 labels.forEach((label,i)=>{const item=b(label,()=>{resultStep=i;go('result')},'result-step'+(i===resultStep?' active':''));item.setAttribute('aria-current',i===resultStep?'step':'false');nav.append(item)});
 cover.append(nav);
 const panel=e('section','result-panel');add(panel,e('p','result-kicker','診断結果の解説'),e('h3','result-panel-title',labels[resultStep]),e('p','result-explain',explains[resultStep]));
 const prose=e('div','prose');prose.append(e('p','',INTRO[t][1][resultStep]));panel.append(prose);cover.append(panel);
 if(resultStep<2){cover.append(b(resultStep===0?'心の奥にあるものを読む':'そんなあなただからこそ、を読む',()=>{resultStep++;go('result')}));}
 else{add(cover,e('p','bridge','そんなあなたに、ひとつの物語があります。'),b('あなたの物語をひらく',()=>{chapter=0;go('book')}));}
 if(resultStep>0)cover.append(b('前の項目に戻る',()=>{resultStep--;go('result')},'quiet'));
 cover.append(e('p','muted','この診断は2つの選択から自分らしさを見つめるための読み物です。すべてが当てはまる必要はありません。'));
 main.append(cover);return}
 if(view==='book'){add(main,e('section','book-cover'));const c=main.firstChild;add(c,e('p','eyebrow','あなただけの物語'),e('div','ornament','✦'),e('div','type-letter',t+' TYPE'),e('h2','',NAMES[t]),e('p','muted','読みたいときに、あなたのペースで。'),b('第一章を読む',()=>{chapter=0;go('chapter')}));return}
 if(view==='chapter'){const scene=STORIES[t][chapter];add(main,e('p','eyebrow',NAMES[t]),e('p','chapter-sub','あなたの物語'));const track=e('div','progress');track.setAttribute('role','progressbar');track.setAttribute('aria-label','物語の進み具合');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');track.setAttribute('aria-valuenow',String(Math.round((chapter+1)/STORIES[t].length*100)));const bar=e('div');bar.style.width=((chapter+1)/STORIES[t].length*100)+'%';track.append(bar);main.append(track);
 const menu=e('details','chapter-menu');const summary=e('summary','','章を選ぶ（必要なときだけ）');menu.append(summary);STORIES[t].forEach((s,i)=>menu.append(b((i===chapter?'● ':'')+s.title,()=>{chapter=i;go('chapter')},'chapter-select')));main.append(menu);
 add(main,e('h1','chapter-heading',scene.title));const prose=e('div','prose');paragraphs(prose,scene.body);main.append(prose);const end=e('div','chapter-end');if(chapter<STORIES[t].length-1){add(end,b('続きを読む',()=>{chapter++;go('chapter')}),b('前の章に戻る',()=>{if(chapter){chapter--;go('chapter')}else go('book')},'quiet'))}else{add(end,b('物語を読み終える',()=>go('finish')),b('前の章に戻る',()=>{chapter--;go('chapter')},'quiet'))}main.append(end);return}
 if(view==='finish'){const fin=e('section','finish');add(fin,e('p','eyebrow','読了'),e('div','type-letter',t+' TYPE'),e('h2','','あなたの物語は、ここまで。'),e('p','','心に残った言葉があれば、どうぞそのまま大切にしてください。'),e('p','','物語の余韻が、あなた自身の明日につながりますように。'),b('もう一度この物語を読む',()=>{chapter=0;go('book')},'btn secondary'),b('最初から診断する',reset,'quiet'));main.append(fin)}
}
render();
</script></body></html>
